<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pruceys Unblocked+</title>
  <link rel="icon" id="page-favicon" href="https://img.icons8.com/fluency/48/controller.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

  <div class="app-layout">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="ri-gamepad-fill"></i></div>
        <div class="brand-text">
          <span class="brand-title">Pruceys</span>
          <span class="brand-badge">Unblocked+</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="games">
          <i class="ri-layout-grid-fill"></i><span>Poki Games</span>
        </button>
        <button class="nav-item" data-tab="browser">
          <i class="ri-compass-3-fill"></i><span>Web Proxy</span>
        </button>
        <button class="nav-item" data-tab="music">
          <i class="ri-spotify-fill" style="color: #1db954;"></i><span>Spotify Music</span>
        </button>
        <button class="nav-item" data-tab="ai">
          <i class="ri-robot-2-fill"></i><span>AI Assistant</span>
        </button>
        <button class="nav-item" data-tab="chat">
          <i class="ri-message-3-fill"></i><span>Live Chat</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" data-tab="account">
          <i class="ri-user-smile-fill"></i><span id="sidebar-user-label">My Account</span>
        </button>
        <button class="nav-item" data-tab="settings">
          <i class="ri-shield-keyhole-fill"></i><span>Tab Cloaker</span>
        </button>
      </div>
    </aside>

    <!-- MAIN APP CANVAS -->
    <div class="main-wrapper">
      
      <!-- TOP BROWSER-STYLE TAB BAR -->
      <header class="top-bar">
        <div class="browser-tabs" id="tab-strip">
          <!-- Browser tabs render dynamically here -->
        </div>
        <button class="new-tab-btn" id="add-tab-btn" title="New Tab"><i class="ri-add-line"></i></button>

        <div class="top-bar-right">
          <div class="account-pill" id="quick-profile-btn">
            <img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Prucey" alt="Avatar">
            <span id="header-username">Guest</span>
          </div>
        </div>
      </header>

      <!-- VIEWPORT PANELS -->
      <main class="viewport">

        <!-- 1. POKI GAMES VIEW -->
        <section id="view-games" class="tab-view active">
          <div class="view-header">
            <div>
              <h2>Poki Games Portal</h2>
              <p class="subtitle">Play full Poki games directly in your browser.</p>
            </div>
            <div class="header-actions">
              <button id="open-poki-frame-btn" class="secondary-btn"><i class="ri-external-link-line"></i> Open Poki.com Site</button>
              <div class="search-box">
                <i class="ri-search-line"></i>
                <input type="text" id="game-search" placeholder="Search Poki games...">
              </div>
            </div>
          </div>
          <div id="games-grid" class="cards-grid"></div>
        </section>

        <!-- 2. MINI BROWSER VIEW -->
        <section id="view-browser" class="tab-view">
          <div class="browser-controls">
            <button id="b-reload" class="icon-btn" title="Reload"><i class="ri-refresh-line"></i></button>
            <div class="url-input-wrap">
              <i class="ri-lock-fill"></i>
              <input type="text" id="browser-url" placeholder="Search with DuckDuckGo or enter URL...">
              <button id="browser-go"><i class="ri-arrow-right-line"></i></button>
            </div>
            <button id="browser-fullscreen" class="icon-btn" title="Fullscreen"><i class="ri-fullscreen-line"></i></button>
          </div>
          <div class="quick-bookmarks">
            <button class="b-mark" data-url="https://duckduckgo.com"><i class="ri-search-2-line"></i> DuckDuckGo</button>
            <button class="b-mark" data-url="https://bing.com"><i class="ri-global-line"></i> Bing</button>
            <button class="b-mark" data-url="https://en.wikipedia.org"><i class="ri-book-read-line"></i> Wikipedia</button>
          </div>
          <div class="iframe-container">
            <iframe id="browser-frame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
          </div>
        </section>

        <!-- 3. SPOTIFY MUSIC VIEW -->
        <section id="view-music" class="tab-view">
          <div class="spotify-container">
            <div class="spotify-header-banner">
              <div class="spotify-banner-info">
                <div class="spotify-logo-wrap"><i class="ri-spotify-fill"></i></div>
                <div>
                  <h2>Spotify Player</h2>
                  <p class="subtitle">Stream official playlists or open the Spotify web login.</p>
                </div>
              </div>
              <div class="spotify-banner-btns">
                <button id="open-spotify-login" class="spotify-btn">
                  <i class="ri-login-box-line"></i> Open Spotify Login
                </button>
                <button id="open-spotify-web" class="secondary-btn">
                  <i class="ri-external-link-line"></i> Launch Web App
                </button>
              </div>
            </div>

            <!-- Playlist Selector Buttons -->
            <div class="spotify-playlists-nav">
              <button class="spotify-tab-btn active" data-spotify="playlist/37i9dQZF1DXcBWIGoYBM5M">🔥 Today's Top Hits</button>
              <button class="spotify-tab-btn" data-spotify="playlist/37i9dQZF1DX0XUsuxWHRQd">⚡ RapCaviar</button>
              <button class="spotify-tab-btn" data-spotify="playlist/37i9dQZF1DX4JAvHpjipBk">🎧 Chill Instrumental</button>
              <button class="spotify-tab-btn" data-spotify="playlist/37i9dQZF1DX1lVhptIYRda">🎮 Gaming Lounge</button>
            </div>

            <!-- Spotify Official Interactive Player Embed -->
            <div class="spotify-embed-card">
              <iframe 
                id="spotify-iframe" 
                src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator&theme=0" 
                width="100%" 
                height="450" 
                frameBorder="0" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
              </iframe>
            </div>
          </div>
        </section>

        <!-- 4. AI ASSISTANT VIEW -->
        <section id="view-ai" class="tab-view">
          <div class="chat-container">
            <div class="chat-header">
              <i class="ri-robot-2-fill"></i>
              <div>
                <h3>Prucey AI</h3>
                <span class="status-online">Active</span>
              </div>
            </div>
            <div id="ai-messages" class="messages-flow"></div>
            <div class="input-composer">
              <input type="text" id="ai-input" placeholder="Ask Prucey AI anything...">
              <button id="ai-send-btn"><i class="ri-send-plane-2-fill"></i></button>
            </div>
          </div>
        </section>

        <!-- 5. CHAT ROOM VIEW -->
        <section id="view-chat" class="tab-view">
          <div class="chat-container">
            <div class="chat-header">
              <i class="ri-discuss-fill"></i>
              <div>
                <h3>Global Lounge</h3>
                <span class="subtitle">Chat with everyone online</span>
              </div>
            </div>
            <div id="room-messages" class="messages-flow"></div>
            <div class="input-composer">
              <input type="text" id="room-input" placeholder="Type a message...">
              <button id="room-send-btn"><i class="ri-send-plane-2-fill"></i></button>
            </div>
          </div>
        </section>

        <!-- 6. ACCOUNT VIEW -->
        <section id="view-account" class="tab-view">
          <div class="account-card">
            <div class="account-body">
              <img id="profile-avatar-display" src="https://api.dicebear.com/7.x/bottts/svg?seed=Prucey" alt="Profile">
              <div class="account-inputs">
                <label>Display Name</label>
                <input type="text" id="account-name-input" placeholder="Your username...">
                
                <label>Avatar Seed (Type any word to customize)</label>
                <input type="text" id="account-seed-input" placeholder="e.g. Sonic, Neon, Cyber...">
                
                <button id="save-account-btn" class="primary-btn"><i class="ri-save-3-fill"></i> Save Profile</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 7. TAB CLOAKER VIEW -->
        <section id="view-settings" class="tab-view">
          <div class="settings-card">
            <h3><i class="ri-shield-keyhole-line"></i> Tab Cloaker</h3>
            <p>Disguise your browser tab as schoolwork:</p>
            <div class="cloak-options">
              <button class="cloak-btn" data-title="Google Classroom" data-icon="https://ssl.gstatic.com/classroom/favicon.png">
                <i class="ri-google-fill"></i> Google Classroom
              </button>
              <button class="cloak-btn" data-title="Google Drive" data-icon="https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png">
                <i class="ri-drive-fill"></i> Google Drive
              </button>
              <button class="cloak-btn" data-title="Canvas LMS" data-icon="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">
                <i class="ri-book-open-fill"></i> Canvas
              </button>
              <button class="cloak-btn" data-title="Pruceys Unblocked+" data-icon="https://img.icons8.com/fluency/48/controller.png">
                <i class="ri-refresh-line"></i> Reset Default
              </button>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- EMBED PLAYER MODAL -->
  <div id="media-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-nav">
        <h3 id="modal-title">Game Player</h3>
        <div class="modal-btn-row">
          <button id="modal-reload" class="icon-btn"><i class="ri-restart-line"></i></button>
          <button id="modal-fullscreen" class="icon-btn"><i class="ri-fullscreen-fill"></i></button>
          <button id="modal-close" class="icon-btn close-btn"><i class="ri-close-line"></i></button>
        </div>
      </div>
      <div id="media-container" class="modal-iframe-wrap">
        <iframe id="media-iframe" src="about:blank" allow="autoplay; fullscreen; gamepad"></iframe>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
